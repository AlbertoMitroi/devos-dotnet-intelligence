# Fixture 23: ABP Framework through a stand-in with ABP's names (as the Aspire stub of fixture 8; real ABP is the
# eShopOnAbp run). A distributed event with [EventName] is published by Ordering and handled by Payment: the identity
# is the event name, the transport comes from the RabbitMQ event bus module both hosts depend on, the exchange and
# queue from RabbitMQ:EventBus (configuration, D21). ConventionalControllers turns the application service into
# endpoints by ABP's route conventions (candidates). The static client proxy takes verb and URL from the generated
# proxy description and its base URL from RemoteServices of the host that runs it, and links to those endpoints.
exitCode: 0
status: complete
