        identity: name:Shop.Order.Placed
      transport: rabbitmq
      destination:
        kind: exchange
        name: Shop
        nameSource: configuration
        configurationKey: RabbitMQ:EventBus:ExchangeName
        ext.dotnet.routingKey: Shop.Order.Placed
      at: src/Ordering/Ordering.cs:15
    - kind: messaging.subscribe
      handler: src/Payment/Payment.csproj|T:Shop.Payment.OrderPlacedHandler
