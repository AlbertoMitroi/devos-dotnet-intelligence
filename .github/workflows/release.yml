name: release

# A release starts from a commit where Directory.Build.props and action.yml already carry the version
# (D17), tagged v<version>. Manual runs build both architectures without pushing (dry run).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/albertomitroi/dotnet-intelligence

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      push: ${{ steps.version.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions agree
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' Directory.Build.props)"
          image="$(sed -n 's#^  image: docker://ghcr.io/albertomitroi/dotnet-intelligence:\(.*\)-action$#\1#p' action.yml)"
          echo "Directory.Build.props=$version action.yml=$image ref=$REF_TYPE/$REF_NAME"
          test -n "$version"
          test "$version" = "$image"
          if [ "$REF_TYPE" = tag ]; then
            test "$REF_NAME" = "v$version"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.arch }}, ${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        target: [runtime, action]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Test stage
        run: docker buildx build --target test --platform "linux/${{ matrix.arch }}" .
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: needs.check.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.check.outputs.push }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.target }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.push == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-architecture manifests
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE@$(cat digests/runtime-amd64)" "$IMAGE@$(cat digests/runtime-arm64)"
          docker buildx imagetools create -t "$IMAGE:$VERSION-action" \
            "$IMAGE@$(cat digests/action-amd64)" "$IMAGE@$(cat digests/action-arm64)"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION-action"
      - name: GitHub release with the contract schema
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          assets=()
          if [ -d schema ]; then
            tar -czf "schema-$VERSION.tar.gz" schema
            assets+=("schema-$VERSION.tar.gz")
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes "Image: $IMAGE:$VERSION (action: $IMAGE:$VERSION-action)" "${assets[@]}"
      - name: Move the major tag
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          major="v${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
